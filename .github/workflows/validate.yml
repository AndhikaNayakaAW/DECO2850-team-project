name: Validate Offshift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: offshift-phone
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: offshift-phone/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test domain behaviour and privacy boundaries
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production routes
        run: npm run build
      - name: Check the standalone prototype
        working-directory: .
        run: node --test prototype/offshift.logic.test.js
